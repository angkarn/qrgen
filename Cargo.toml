[workspace]
members = ["crates/qrgen", "crates/qrgen-cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
authors = ["Angkarn Pukawanach <angkarn.pk@gmail.com>"]
repository = "https://github.com/angkarn/qrgen"

[workspace.dependencies]
textplate = { git = "https://github.com/angkarn/textplate", tag = "v0.1.0", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
