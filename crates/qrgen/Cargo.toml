[package]
name = "qrgen"
description = "Generate QR code images with text layouts from templates and data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["decode", "default-font"]
# Decode png, jpeg, webp, gif and bmp images (base images and `image` nodes)
decode = ["textplate/decode"]
# Embed a default Latin font (Poppins, ~150 KB): `qrgen::DEFAULT_FONT`
default-font = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
qrcodegen = "1.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
textplate.workspace = true
thiserror = "2"

[dev-dependencies]
rqrr = { version = "0.11", features = ["img"] }
