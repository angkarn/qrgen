name: Release

# Builds qrgen for every release target and publishes a GitHub release.
# Run manually: Actions > Release > Run workflow (version must have a "## <version>" section in CHANGELOG.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0"
        required: true
      rust_text_draw_ref:
        description: "angkarn/rust-text-draw git ref to build against"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: qrgen, asset: x86_64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu, bin: qrgen.exe, asset: x86_64-pc-windows-gnu, smoke: false }
          - { os: ubuntu-latest, target: wasm32-wasip1, bin: qrgen.wasm, asset: qrgen_wasi.wasm, smoke: false }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: qrgen, asset: aarch64-apple-darwin, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, bin: qrgen, asset: x86_64-apple-darwin, smoke: false }
    steps:
      # qrgen depends on rust-text-draw via `path = "../rust-text-draw"`, so check both out side by side
      - uses: actions/checkout@v4
        with:
          path: qrgen
      - uses: actions/checkout@v4
        with:
          repository: angkarn/rust-text-draw
          ref: ${{ inputs.rust_text_draw_ref }}
          path: rust-text-draw

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        working-directory: qrgen
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        working-directory: qrgen
        run: |
          ./target/${{ matrix.target }}/release/qrgen --version
          ./target/${{ matrix.target }}/release/qrgen config example/json5_config/gen_draw_full.json5
          ./target/${{ matrix.target }}/release/qrgen config example/json5_config/from_draw_base_image.json5
          test -s output/qr.png

      - name: Collect asset
        run: |
          mkdir dist
          cp qrgen/target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$crate_version" != "$VERSION" ]; then
            echo "Cargo.toml version ($crate_version) does not match $VERSION"; exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ls -l dist
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md
