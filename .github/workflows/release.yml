name: Release

# Builds qrgen for every release target and publishes a GitHub release.
# Run manually: Actions > Release > Run workflow (version must have a "## <version>" section in CHANGELOG.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: qrgen, asset: x86_64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu, bin: qrgen.exe, asset: x86_64-pc-windows-gnu, smoke: false }
          - { os: ubuntu-latest, target: wasm32-wasip1, bin: qrgen.wasm, asset: qrgen_wasi.wasm, smoke: false }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: qrgen, asset: aarch64-apple-darwin, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, bin: qrgen, asset: x86_64-apple-darwin, smoke: false }
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: cargo build --release --locked -p qrgen-cli --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        run: |
          ./target/${{ matrix.target }}/release/qrgen --version
          ./target/${{ matrix.target }}/release/qrgen run example/hello.json5
          ./target/${{ matrix.target }}/release/qrgen run example/photo.json5
          test -s example/output/hello.png

      - name: Collect asset
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  web:
    name: Build the browser package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          rustup target add wasm32-unknown-unknown
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
          npm install -g binaryen@132.0.0

      - name: Build
        run: crates/qrgen-wasm/build.sh dist/qrgen-web

      - name: Smoke test
        run: |
          cat > smoke.mjs <<'JS'
          import { readFileSync } from "node:fs";
          const { default: init, Batch } = await import("./dist/qrgen-web/qrgen.js");
          await init({ module_or_path: readFileSync("dist/qrgen-web/qrgen_bg.wasm") });
          const image = new Batch('{ data: "hello" }', new Map()).render(0);
          if (image.png.length < 100) throw new Error("no image");
          JS
          node smoke.mjs

      - name: Package
        run: tar -czf dist/qrgen-web.tar.gz -C dist qrgen-web

      - uses: actions/upload-artifact@v4
        with:
          name: qrgen-web
          path: dist/qrgen-web.tar.gz
          if-no-files-found: error

  release:
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"  # [workspace.package]
          if [ "$crate_version" != "$VERSION" ]; then
            echo "Cargo.toml version ($crate_version) does not match $VERSION"; exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ls -l dist
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md
